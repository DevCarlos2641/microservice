server:
  port: 8761

spring:
  application:
    name: msvc-eureka
  config:
    import: optional:configserver:http://localhost:8888

eureka:
  instance:
    hostname: msvc-eureka

  client:
    register-with-eureka: false
    fetch-registry: false
    server-url:
      defaultZone: http://msvc-eureka:${server.port}/eureka/