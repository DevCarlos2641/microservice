spring.application.name=msvc-course

server.port=9090
eureka.instance.hostname=msvc-course
eureka.client.service-url.defaultZone=http://msvc-eureka:8761/eureka

#   Configuration for DB
spring.data.mongodb.uri=mongodb://mongo-server:27017/course
management.endpoints.web.exposure.include=mappings

spring.config.import=optional:configserver:http://localhost:8888


# Try to connect
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=30000
spring.jpa.properties.hibernate.hbm2ddl.retry_attempts=5